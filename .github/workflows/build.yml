name: Build KoiTerm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          set -e
          if [ ! -d app ] && [ -f KoiTerm-src.zip ]; then
            unzip -q KoiTerm-src.zip
            # zip 内 mtime 可能来自"未来"（打包设备时钟偏差），否则 ninja 会一直重试
            find . -exec touch {} + 2>/dev/null || true
          fi
          if [ -d KoiTerm/app ]; then echo "PROJ=KoiTerm" >> "$GITHUB_ENV"; else echo "PROJ=." >> "$GITHUB_ENV"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform / build-tools / NDK / CMake
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK (non-debuggable)
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify native lib and debuggable flag
        working-directory: ${{ env.PROJ }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcoreio.so"
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          BADGING=$("$AAPT2" dump badging "$APK" | head -1)
          echo "$BADGING"
          if "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q "debuggable"; then
            echo "::error::APK is debuggable"; exit 1
          fi
          echo "non-debuggable OK"

      - name: Sign check
        working-directory: ${{ env.PROJ }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: KoiTerm-release-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
