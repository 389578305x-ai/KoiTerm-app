name: Build KoiTerm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          set -e
          if [ ! -d app ] && [ -f KoiTerm-src.zip ]; then unzip -q KoiTerm-src.zip; fi
          if [ -d KoiTerm/app ]; then echo "PROJ=KoiTerm" >> "$GITHUB_ENV"; else echo "PROJ=." >> "$GITHUB_ENV"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform / build-tools / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK with PTY
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify libkoipty.so inside APK
        working-directory: ${{ env.PROJ }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E "lib/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libkoipty.so"
          echo "PTY native lib OK"

      - name: Sign check
        working-directory: ${{ env.PROJ }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: KoiTerm-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
