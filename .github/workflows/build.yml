name: Build KoiTerm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 兼容两种放法：直接把工程推到仓库根，或只上传一个 KoiTerm-src.zip
      - name: Prepare sources
        run: |
          set -e
          if [ ! -d app ] && [ -f KoiTerm-src.zip ]; then
            unzip -q KoiTerm-src.zip
            # zip 内 mtime 可能来自"未来"（打包设备时钟偏差），
            # 会让 ninja 认为 build.ninja 永远 dirty（still dirty after 100 tries）
            find . -exec touch {} + 2>/dev/null || true
            echo "mtimes normalized"
          fi
          if [ -d KoiTerm/app ]; then echo "PROJ=KoiTerm" >> "$GITHUB_ENV"; else echo "PROJ=." >> "$GITHUB_ENV"; fi
          echo "project dir -> $(grep ^PROJ "$GITHUB_ENV")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，直接用它，避免 setup-android 下载失败
      - name: Install platform / build-tools / NDK / CMake
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME  SDKROOT=$SDKROOT"
          ls "$SDKROOT" || true
          SDKM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 默认 -PkoiPty=true：走 CMake 编 libkoipty.so（真 PTY 伪终端）
      - name: Build debug APK with PTY
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify libkoipty.so inside APK
        working-directory: ${{ env.PROJ }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E "lib/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libkoipty.so"
          echo "PTY native lib OK"

      - name: Sign check
        working-directory: ${{ env.PROJ }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: KoiTerm-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
